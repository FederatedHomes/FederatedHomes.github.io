[superlink]
default = "local"

[superlink.supergrid]
address = "supergrid.flower.ai"

# Development-only local deployment profile.
[superlink.local]
address = ":local:"

[superlink.local-deployment]
address = "superlink:9093"
insecure = true

# PRODUCTION PROFILE — GENERATED BY ./setup.sh FROM SUPERLINK_HOST.
# Do not edit this address independently; Fleet is derived as :9092 and
# Control API as :9093 from the same SUPERLINK_HOST value.
# The address must match a DNS name or IP covered by superlink.crt.
[superlink.production-deployment]
address = "fl.example.internal:9093"
root-certificates = "/app/certificates/prod/tls/ca.crt"
