networks:
  flwr-network:
    driver: bridge

services:
  superlink:
    image: flwr/superlink:1.33.0
    container_name: flwr_superlink
    command: ["--insecure", "--isolation", "process"]
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    networks:
      - flwr-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"127.0.0.1\",9091))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  supernode-1:
    image: flwr/supernode:1.33.0
    container_name: flwr_supernode_1
    command: ["--insecure", "--superlink", "superlink:9092", "--node-config", "partition-id=0 num-partitions=2", "--clientappio-api-address", "0.0.0.0:9094", "--isolation", "process"]
    ports:
      - "9094:9094"
    networks:
      - flwr-network
    depends_on:
      - superlink
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"127.0.0.1\",9094))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  supernode-2:
    image: flwr/supernode:1.33.0
    container_name: flwr_supernode_2
    command: ["--insecure", "--superlink", "superlink:9092", "--node-config", "partition-id=1 num-partitions=2", "--clientappio-api-address", "0.0.0.0:9095", "--isolation", "process"]
    ports:
      - "9095:9095"
    networks:
      - flwr-network
    depends_on:
      - superlink
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"127.0.0.1\",9095))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  superexec-serverapp:
    build:
      context: .
      dockerfile: Dockerfile.superexec
    image: flwr_superexec:local
    container_name: flwr_superexec_serverapp
    env_file:
      - .env
    command: ["--insecure", "--plugin-type", "serverapp", "--appio-api-address", "superlink:9091"]
    networks:
      - flwr-network
    volumes:
      - .:/app
    depends_on:
      - superlink
      - supernode-1
      - supernode-2
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"superlink\",9091))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  superexec-clientapp-1:
    image: flwr_superexec:local
    container_name: flwr_superexec_clientapp_1
    env_file:
      - .env
    command: ["--insecure", "--plugin-type", "clientapp", "--appio-api-address", "supernode-1:9094"]
    networks:
      - flwr-network
    volumes:
      - ./data/client1:/app/data
      - ./checkpoints/client1:/app/checkpoints
    environment:
      - CLIENT_ID=1
    depends_on:
      - supernode-1
      - superlink
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"supernode-1\",9094))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  superexec-clientapp-2:
    image: flwr_superexec:local
    container_name: flwr_superexec_clientapp_2
    env_file:
      - .env
    command: ["--insecure", "--plugin-type", "clientapp", "--appio-api-address", "supernode-2:9095"]
    networks:
      - flwr-network
    volumes:
      - ./data/client2:/app/data
      - ./checkpoints/client2:/app/checkpoints
    environment:
      - CLIENT_ID=2
    depends_on:
      - supernode-2
      - superlink
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"supernode-2\",9095))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  trainer:
    image: flwr/superexec:1.33.0
    container_name: flwr_trainer
    # Use the flwr CLI from the image to start the federated run; mount the app
    entrypoint: ["flwr"]
    command: ["run", ".", "local-deployment", "--stream"]
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - flwr-network
    depends_on:
      - superlink
      - supernode-1
      - supernode-2
      - superexec-serverapp
      - superexec-clientapp-1
      - superexec-clientapp-2
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys,os; s=socket.socket(); s.settimeout(1); sys.exit(0) if s.connect_ex((\"superlink\",9091))==0 else sys.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  data:
  checkpoints:
